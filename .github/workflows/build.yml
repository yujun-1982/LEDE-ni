name: Build OpenWrt Custom Firmware

# Never put subscription URLs, passwords, or API tokens in the repository.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: [ 'README.md' ]
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]

permissions:
  contents: read

# Keep only the latest firmware build running for this branch/PR.
concurrency:
  group: openwrt-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  OPENWRT_REF: master

jobs:
  build:
    name: Prepare, verify and build firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Static shell syntax checks
        run: |
          set -euo pipefail
          bash -n build.sh
          while IFS= read -r -d '' script; do
            sh -n "$script"
          done < <(find files/etc/init.d files/etc/uci-defaults files/usr/libexec -type f -print0)
          echo "Shell syntax checks passed."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ccache
          sudo apt-get autoclean && sudo apt-get clean

      - name: Prepare OpenWrt using the same script as local builds
        run: |
          set -euo pipefail
          JOBS="$(nproc)"
          [ "$JOBS" -le 2 ] || JOBS=2
          JOBS="$JOBS" ./build.sh
          mkdir -p artifacts
          cp openwrt/build-sources.txt artifacts/
          cp openwrt/.config artifacts/config.build

      - name: Download sources
        run: |
          set -o pipefail
          JOBS="$(nproc)"
          [ "$JOBS" -le 2 ] || JOBS=2
          make -C openwrt -j"$JOBS" download 2>&1 | tee artifacts/download.log | tail -200

      - name: Compile firmware
        run: |
          set -o pipefail
          JOBS="$(nproc)"
          [ "$JOBS" -le 2 ] || JOBS=2
          make -C openwrt -j"$JOBS" V=s 2>&1 | tee artifacts/build.log | tail -200

      - name: Collect firmware artifacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d openwrt/bin/targets ]; then
            find openwrt/bin/targets -type f \( -name '*.img.gz' -o -name '*.bin' -o -name '*.img' \
              -o -name '*.manifest' -o -name '*.buildinfo' \) -exec cp {} artifacts/ \;
          fi
          [ ! -f openwrt/.config ] || cp openwrt/.config artifacts/config.build
          [ ! -f openwrt/build-sources.txt ] || cp openwrt/build-sources.txt artifacts/
          ls -lah artifacts || true

      - name: Upload logs, source manifest and firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
